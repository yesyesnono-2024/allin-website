<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Allin Game Studio creates playful puzzle games with purpose."><meta name="theme-color" content="#03040f">
<title>Allin Game Studio</title>
<style>
:root{--pink:#ff087a;--blue:#169dff;--ink:#03040f;--muted:#bbb9c4;--pad:clamp(24px,5.7vw,88px)}*{box-sizing:border-box;margin:0;padding:0}html{background:var(--ink);scroll-behavior:smooth;scroll-snap-type:y mandatory}body{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--ink);color:#fff;overflow-x:hidden}a{color:inherit;text-decoration:none}.header{position:fixed;z-index:20;inset:0 0 auto;height:130px;display:flex;align-items:center;justify-content:space-between;padding:18px var(--pad);pointer-events:none}.brand,.nav{pointer-events:auto}.brand{width:95px;height:95px;display:block;border-radius:18px;overflow:hidden;box-shadow:0 0 24px #ff087a22}.brand img{width:100%;height:100%;object-fit:cover}.nav{display:flex;gap:clamp(26px,5vw,72px)}.nav a{position:relative;padding:10px 0;font-size:17px}.nav a:after{content:"";position:absolute;left:0;right:100%;bottom:2px;height:2px;background:var(--pink);transition:.35s}.nav a.active{color:var(--pink)}.nav a.active:after{right:0}.section{position:relative;min-height:100svh;scroll-snap-align:start;scroll-snap-stop:always;display:grid;overflow:hidden;padding:145px var(--pad) 88px;isolation:isolate}.section:before{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(circle at 72% 55%,#2b105b47,transparent 45%),linear-gradient(135deg,#02030d,#050516 65%,#080312)}.section:after{content:"";position:absolute;inset:auto 0 0;height:28%;z-index:-1;opacity:.28;background:linear-gradient(#ff087a47 1px,transparent 1px),linear-gradient(90deg,#3566ff47 1px,transparent 1px);background-size:52px 32px;transform:perspective(280px) rotateX(58deg);transform-origin:bottom;mask-image:linear-gradient(transparent,#000)}.hero{grid-template-columns:minmax(320px,.9fr) minmax(460px,1.25fr);align-items:center;gap:3vw}.eyebrow{color:var(--pink);text-transform:uppercase;font-size:15px;font-weight:650;letter-spacing:.23em;margin-bottom:25px}h1,h2{font-size:clamp(48px,5.2vw,78px);line-height:1.08;letter-spacing:-.045em;text-wrap:balance}.accent{color:var(--pink)}.copy{max-width:600px;margin-top:31px;color:#c7c4cb;font-size:clamp(17px,1.4vw,21px);line-height:1.75}.cta{display:inline-flex;align-items:center;gap:26px;margin-top:42px;padding:19px 30px;border:1px solid var(--pink);border-radius:8px;color:var(--pink);transition:.25s}.cta:hover{background:var(--pink);color:#fff;box-shadow:0 0 32px #ff087a59}.cta span{font-size:28px}.hero-art{width:min(100%,760px);justify-self:end;filter:drop-shadow(0 0 26px #ff007833)}.hero-art img{display:block;width:100%;border-radius:12px}.about{grid-template-columns:minmax(340px,.72fr) minmax(560px,1.28fr);gap:4vw;align-items:center}.about .copy{font-size:clamp(16px,1.28vw,19px);line-height:1.62}.controller{width:100%;max-width:740px;display:block;margin:0 auto 28px;border-radius:16px}.process{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.step{text-align:center}.step-icon{width:70px;height:70px;margin:0 auto 14px;border:2px solid currentColor;border-radius:50%;display:grid;place-items:center;font-size:29px;box-shadow:0 0 18px currentColor}.step:nth-child(1){color:#ff298b}.step:nth-child(2){color:#25a9ff}.step:nth-child(3){color:#a6ef43}.step:nth-child(4){color:#ff8a27}.step h3{color:#fff;font-size:19px;margin-bottom:9px}.step p{color:#aaa8b3;font-size:13px;line-height:1.5;max-width:165px;margin:auto}.games{place-items:center;text-align:center}.games-wrap{z-index:1;max-width:960px}.games h2{font-size:clamp(58px,9vw,138px);text-transform:uppercase;color:transparent;-webkit-text-stroke:1px #ffffffe8;text-shadow:0 0 36px #ff087a47}.games .copy{margin:28px auto}.pixels{position:absolute;inset:0;z-index:-1}.pixels i{position:absolute;width:clamp(9px,1.2vw,18px);aspect-ratio:1;background:var(--c);left:var(--x);top:var(--y);box-shadow:0 0 17px var(--c);animation:float 4s ease-in-out infinite alternate;animation-delay:var(--d)}.legal{position:absolute;left:var(--pad);right:var(--pad);bottom:26px;color:#8f8d99;font-size:12px;z-index:4}.legal strong{display:block;color:#d8d5df;margin-bottom:4px;font-weight:500}.dots{position:fixed;z-index:22;right:26px;top:50%;display:grid;gap:11px}.dot{width:8px;height:8px;border:0;border-radius:50%;background:#5a5867;cursor:pointer}.dot.active{background:var(--pink);box-shadow:0 0 13px var(--pink);transform:scale(1.35)}.reveal{opacity:0;transform:translateY(34px);transition:opacity .7s,transform .75s cubic-bezier(.2,.7,.2,1)}.section.active .reveal{opacity:1;transform:none}@keyframes float{to{transform:translateY(-18px) rotate(12deg)}}
@media(max-width:900px){.header{height:94px;padding-top:10px}.brand{width:70px;height:70px}.nav{gap:22px}.nav a{font-size:14px}.section{padding-top:112px;padding-bottom:104px}.hero,.about{grid-template-columns:1fr;gap:24px;align-content:center}.hero-art{width:min(76vw,520px);justify-self:center}.controller{width:min(82vw,600px);margin-bottom:18px}.about .cta{display:none}.step p{display:none}.step-icon{width:54px;height:54px;font-size:22px}.step h3{font-size:14px}}
@media(max-width:560px){:root{--pad:22px}.nav{gap:16px}.nav a{font-size:13px}.brand{width:58px;height:58px}.section{padding-top:92px}.eyebrow{font-size:11px;margin-bottom:15px}h1,h2{font-size:clamp(39px,12vw,58px)}.copy{font-size:15px;line-height:1.55;margin-top:18px}.cta{margin-top:24px;padding:14px 20px}.hero-art{width:94vw;margin-right:-9vw}.about{align-content:start;gap:8px}.about h2{font-size:37px}.about .copy p:nth-child(2){display:none}.controller{width:105%;margin-left:-2.5%}.step-icon{width:44px;height:44px;font-size:18px}.legal{font-size:9px;bottom:16px}.dots{right:9px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal{opacity:1;transform:none;transition:none}.pixels i{animation:none}}
</style>
<style>
.intro{position:fixed;z-index:100;inset:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 50%,#180628 0,#050510 43%,#01020a 100%);transition:opacity .55s ease,visibility .55s}.intro.finished{opacity:0;visibility:hidden;pointer-events:none}.intro-logo{position:relative;z-index:2;width:min(54vw,420px);aspect-ratio:1;object-fit:cover;border-radius:clamp(28px,5vw,58px);opacity:0;transform:scale(.8);animation:introLogo .9s .65s cubic-bezier(.2,.8,.2,1) forwards}.intro-pixels{position:absolute;inset:0}.intro-pixels i{position:absolute;left:var(--x);top:var(--y);width:var(--s);aspect-ratio:1;background:var(--c);box-shadow:0 0 22px var(--c);opacity:0;animation:gather 1.25s var(--d) cubic-bezier(.2,.7,.2,1) forwards}.skip{position:absolute;z-index:3;right:clamp(20px,4vw,54px);bottom:clamp(20px,4vw,42px);border:1px solid #ffffff55;border-radius:999px;background:#09091488;color:#d8d6df;padding:10px 18px;cursor:pointer;letter-spacing:.08em;transition:.25s}.skip:hover{border-color:var(--pink);color:#fff}.intro-active{overflow:hidden}.intro-active .hero .reveal{opacity:0;transform:translateY(34px)}@keyframes gather{0%{opacity:0;transform:scale(.3) rotate(0)}25%{opacity:1}100%{opacity:0;left:50%;top:50%;transform:scale(.7) rotate(180deg)}}@keyframes introLogo{0%{opacity:0;transform:scale(.8);filter:brightness(.65)}70%{opacity:1;transform:scale(1.035);filter:brightness(1.2) drop-shadow(0 0 38px #ff087a88)}100%{opacity:1;transform:scale(1);filter:brightness(1) drop-shadow(0 0 22px #ff087a55)}}@media(prefers-reduced-motion:reduce){.intro{display:none}}
</style>
</head>
<body>
<div class="intro" id="intro" aria-label="Allin Game Studio introduction"><div class="intro-pixels" id="introPixels" aria-hidden="true"></div><img class="intro-logo" id="introLogo" alt="Allin Game Studio"><button class="skip" id="skipIntro" type="button">Skip</button></div>
<header class="header"><a class="brand" href="#home" aria-label="Allin Game Studio home"><img id="logo" alt="Allin Game Studio"></a><nav class="nav" aria-label="Main navigation"><a href="#home" data-section="home">Home</a><a href="#about" data-section="about">About</a><a href="#games" data-section="games">Games</a></nav></header>
<main>
<section class="section hero" id="home"><div class="reveal"><p class="eyebrow" data-copy="home.eyebrow"></p><h1 data-copy="home.title" data-html></h1><p class="copy" data-copy="home.body"></p><a class="cta" href="#about"><b data-copy="home.button"></b><span>→</span></a></div><figure class="hero-art reveal"><img id="homeImage" alt="A colorful gateway into a playful game world"></figure><div class="legal"><strong>Allin Game Studio</strong>© 2026 All In Media International Limited. All rights reserved.</div></section>
<section class="section about" id="about"><div class="reveal"><p class="eyebrow" data-copy="about.eyebrow"></p><h2 data-copy="about.title" data-html></h2><div class="copy"><p data-copy="about.body"></p><br><p data-copy="about.body2"></p></div><a class="cta" href="#games"><b data-copy="about.button"></b><span>→</span></a></div><div class="reveal"><img class="controller" id="aboutImage" alt="Neon game controller"><div class="process" id="process"></div></div><div class="legal"><strong>Allin Game Studio</strong>© 2026 All In Media International Limited. All rights reserved.</div></section>
<section class="section games" id="games"><div class="pixels"></div><div class="games-wrap reveal"><p class="eyebrow" data-copy="games.eyebrow"></p><h2 data-copy="games.title"></h2><p class="copy" data-copy="games.body"></p></div><div class="legal"><strong>Allin Game Studio</strong>© 2026 All In Media International Limited. All rights reserved.</div></section>
</main><div class="dots"><button class="dot" data-target="home" aria-label="Home"></button><button class="dot" data-target="about" aria-label="About"></button><button class="dot" data-target="games" aria-label="Games"></button></div>
<script>
/* EDITABLE CONTENT: change any text or replace an image path here. */
const siteContent={
 images:{logo:'assets/logo-original.png',home:'assets/home-art.png',about:'assets/about-controller.png'},
 home:{eyebrow:'We create games people love',title:'Playful worlds.<br>Built with purpose<span class="accent">.</span>',body:'Allin Game Studio creates simple, addictive puzzle games with heart. We turn ideas into delightful experiences that players return to, again and again.',button:'Explore our studio'},
 about:{eyebrow:'About us',title:'We make games<br>people <span class="accent">love</span> to<br>return to.',body:'At Allin Game Studio, we create simple, addictive puzzle games that fit perfectly into everyday life. Our mission is to craft experiences that are easy to pick up but hard to put down—and stay with you long after you close the game.',body2:'We’re a passionate team of designers, developers, and dreamers who believe great games come from curiosity, creativity, and care.',button:'Our approach'},
 games:{eyebrow:'Our games',title:'To be continued',body:'We’re building our first games with care. Real titles and original artwork will appear here when they’re ready.'},
 process:[['💡','Ideate','We explore ideas and turn spark into potential.'],['✎','Design','We craft intuitive mechanics and delightful moments.'],['‹/›','Build','We develop clean, reliable games with performance in mind.'],['✦','Polish','We refine every detail until it feels just right.']]
};
logo.src=siteContent.images.logo;homeImage.src=siteContent.images.home;aboutImage.src=siteContent.images.about;
document.querySelectorAll('[data-copy]').forEach(el=>{const[g,k]=el.dataset.copy.split('.');el[el.hasAttribute('data-html')?'innerHTML':'textContent']=siteContent[g][k]});
process.innerHTML=siteContent.process.map(([i,t,p])=>`<article class="step"><div class="step-icon">${i}</div><h3>${t}</h3><p>${p}</p></article>`).join('');
const sections=[...document.querySelectorAll('.section')],links=[...document.querySelectorAll('[data-section]')],dots=[...document.querySelectorAll('.dot')];
new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){sections.forEach(s=>s.classList.toggle('active',s===e.target));links.forEach(a=>a.classList.toggle('active',a.dataset.section===e.target.id));dots.forEach(d=>d.classList.toggle('active',d.dataset.target===e.target.id))}}),{threshold:.6}).observe(sections[0]);
const observer=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){sections.forEach(s=>s.classList.toggle('active',s===e.target));links.forEach(a=>a.classList.toggle('active',a.dataset.section===e.target.id));dots.forEach(d=>d.classList.toggle('active',d.dataset.target===e.target.id))}}),{threshold:.6});sections.forEach(s=>observer.observe(s));
dots.forEach(d=>d.onclick=()=>document.getElementById(d.dataset.target).scrollIntoView({behavior:'smooth'}));
const colors=['#ff087a','#6f22ff','#169dff','#8bed00','#ff7900'];document.querySelector('.pixels').innerHTML=Array.from({length:34},(_,i)=>`<i style="--x:${7+(i*29)%87}%;--y:${16+(i*37)%70}%;--c:${colors[i%5]};--d:-${(i%7)*.45}s"></i>`).join('');
document.body.classList.add('intro-active');introLogo.src=siteContent.images.logo;introPixels.innerHTML=Array.from({length:46},(_,i)=>`<i style="--x:${3+(i*37)%94}%;--y:${5+(i*53)%90}%;--s:${7+(i%4)*5}px;--c:${colors[i%5]};--d:${(i%9)*.055}s"></i>`).join('');let introTimer;const finishIntro=()=>{clearTimeout(introTimer);intro.classList.add('finished');document.body.classList.remove('intro-active');setTimeout(()=>intro.remove(),600)};skipIntro.onclick=finishIntro;if(matchMedia('(prefers-reduced-motion: reduce)').matches)finishIntro();else introTimer=setTimeout(finishIntro,2750);
</script></body></html>
