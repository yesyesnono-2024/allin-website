<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allin</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #111111;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    h1 {
      font-size: clamp(56px, 10vw, 110px);
      letter-spacing: -4px;
      margin-bottom: 18px;
    }

    p {
      font-size: 20px;
      color: #666666;
    }

    footer {
      position: fixed;
      bottom: 24px;
      width: 100%;
      text-align: center;
      font-size: 14px;
      color: #999999;
    }
  </style>
</head>

<body>
  <main>
    <div>
      <h1>Allin</h1>
      <p>Something great is coming.</p>
    </div>
  </main>

  <footer>
    © 2026 Allin
  </footer>
</body>
</html>
